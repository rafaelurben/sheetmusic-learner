name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-backend:
    if: github.ref_type == 'branch'
    name: checks::backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend formatting check
        run: mvn -B -f backend/pom.xml spotless:check

  checks-backend-tests:
    if: github.ref_type == 'branch'
    name: checks::backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  checks-frontend-tests:
    if: github.ref_type == 'branch'
    name: checks::frontend-tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rafaelurben/node25-trixie-with-jdk25:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache npm data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --cache .npm --prefer-offline
          npm run generate:openapi
          npm run test:ci
      - name: Upload frontend test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn

  checks-frontend:
    if: github.ref_type == 'branch'
    name: checks::frontend
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rafaelurben/node25-trixie-with-jdk25:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache npm data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Run frontend checks
        run: |
          cd frontend
          npm ci --cache .npm --prefer-offline
          npm run generate:openapi
          npm run lint
          npm run typescript-check

  build-backend:
    if: github.ref_type == 'branch'
    name: build::backend
    runs-on: ubuntu-latest
    needs:
      - checks-backend
      - checks-backend-tests
      - checks-frontend
      - checks-frontend-tests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build backend package
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Upload backend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jar
          path: backend/target/backend-*.jar
          if-no-files-found: error

  build-frontend:
    if: github.ref_type == 'branch'
    name: build::frontend
    runs-on: ubuntu-latest
    needs:
      - checks-backend
      - checks-backend-tests
      - checks-frontend
      - checks-frontend-tests
    container:
      image: ghcr.io/rafaelurben/node25-trixie-with-jdk25:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache npm data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Build frontend
        run: |
          cd frontend
          npm ci --cache .npm --prefer-offline
          npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/nginx.conf
          if-no-files-found: error

  release:
    if: github.ref_name == 'main' || github.ref_type == 'tag'
    needs:
      - build-backend
      - build-frontend
    uses: rafaelurben/cloud-deployments/.github/workflows/release.yml@main
    with:
      project-name: sheetmusic-learner
      registry-host: ${{ vars.CI_REGISTRY }}
      deployment-repository: rafaelurben/cloud-deployments
      deployment-source-root: deploy
      images: >-
        [
          {
            "context": ".",
            "dockerfile": "backend/Dockerfile",
            "suffix": "-backend",
            "artifact_name": "backend-jar",
            "artifact_path": "backend/target"
          },
          {
            "context": ".",
            "dockerfile": "frontend/Dockerfile",
            "suffix": "-frontend",
            "artifact_name": "frontend-build",
            "artifact_path": "frontend"
          }
        ]
    secrets:
      REGISTRY_USERNAME: ${{ vars.CI_REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
      DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
